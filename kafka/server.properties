# Broker ID - Phải unique trong cluster
broker.id=1

# Listeners cho client kết nối
listeners=PLAINTEXT://0.0.0.0:9092

# Advertised listeners - Quan trọng trong Docker (dùng hostname)
advertised.listeners=PLAINTEXT://kafka:9092

# Listener security (dùng PLAINTEXT cho test)
listener.security.protocol.map=PLAINTEXT:PLAINTEXT

# Kết nối đến Zookeeper
zookeeper.connect=zookeeper:2181

# Timeout khi kết nối Zookeeper
zookeeper.connection.timeout.ms=18000

# Thư mục lưu dữ liệu topic
log.dirs=/home/kafka/kafka/data

# Số partition mặc định khi tạo topic mới
num.partitions=3

# Mới thêm
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Replication factor mặc định (1 cho single broker)
default.replication.factor=1

# Minimum replicas phải đồng bộ trước khi trả về ack
min.insync.replicas=1

# Giữ log trong 7 ngày
log.retention.hours=168

# Kích thước mỗi segment log
log.segment.bytes=1073741824

# Kiểm tra retention mỗi 5 phút
log.retention.check.interval.ms=300000

num.network.threads=3
num.io.threads=8

socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

log4j.rootLogger=INFO, stdout