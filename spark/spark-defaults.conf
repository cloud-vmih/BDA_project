# Iceberg Configuration
spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.1
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type=hive
spark.sql.catalog.iceberg.uri=thrift://23133083thuyvan-master:9083
spark.sql.catalog.iceberg.warehouse=hdfs://23133083thuyvan-master:9000/user/hive/lakehouse
spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.hadoop.HadoopFileIO


# Hadoop Config 
spark.hadoop.fs.defaultFS=hdfs://23133083thuyvan-master:9000
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem

# Performance 
spark.executor.memory=2g
spark.driver.memory=2g
spark.executor.cores=2
spark.sql.shuffle.partitions=50
spark.dynamicAllocation.enabled=true

# Kafka & Streaming 
spark.kafka.bootstrap.servers=kafka:9092
spark.streaming.backpressure.enabled=true
spark.streaming.kafka.maxRatePerPartition=10000